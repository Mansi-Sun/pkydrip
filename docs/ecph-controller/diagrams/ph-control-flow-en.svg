<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 580" width="480" height="580">
  <rect width="480" height="580" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0057B8"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1FA463"/>
    </marker>
  </defs>
  <style>
    .box { fill: #F4F6F8; stroke: #0057B8; stroke-width: 2; rx: 6; }
    .box-mode { fill: #E8F4FD; stroke: #0057B8; stroke-width: 2; rx: 6; }
    .box-end { fill: #1FA463; stroke: #1FA463; stroke-width: 2; rx: 6; }
    .text { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #333333; text-anchor: middle; }
    .text-white { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #FFFFFF; text-anchor: middle; font-weight: bold; }
    .text-mode { font-family: Arial, sans-serif; font-size: 12px; fill: #0057B8; font-weight: bold; }
    .line { stroke: #0057B8; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .line-green { stroke: #1FA463; stroke-width: 2; fill: none; marker-end: url(#arrow-green); }
  </style>
  <rect class="box" x="140" y="16" width="200" height="40"/>
  <text class="text" x="240" y="41">Read pH</text>
  <line class="line" x1="240" y1="56" x2="240" y2="76"/>
  <rect class="box-mode" x="120" y="76" width="240" height="40"/>
  <text class="text" x="240" y="101">Check PH Control Mode</text>
  <line class="line" x1="240" y1="116" x2="240" y2="136"/>
  <rect class="box" x="60" y="136" width="160" height="52"/>
  <text class="text-mode" x="140" y="156">Base mode</text>
  <text class="text" x="140" y="176" font-size="11">pH below target minus band</text>
  <line class="line-green" x1="140" y1="188" x2="140" y2="208"/>
  <rect class="box" x="60" y="208" width="160" height="40"/>
  <text class="text" x="140" y="233">Run pH pump</text>
  <line class="line" x1="140" y1="248" x2="140" y2="268"/>
  <rect class="box" x="60" y="268" width="160" height="36"/>
  <text class="text" x="140" y="290">Wait (mixing)</text>
  <line class="line" x1="140" y1="304" x2="140" y2="324"/>
  <rect class="box" x="60" y="324" width="160" height="40"/>
  <text class="text" x="140" y="349">Re-read pH</text>
  <rect class="box" x="260" y="136" width="160" height="52"/>
  <text class="text-mode" x="340" y="156">Acid mode</text>
  <text class="text" x="340" y="176" font-size="11">pH above target plus band</text>
  <line class="line-green" x1="340" y1="188" x2="340" y2="208"/>
  <rect class="box" x="260" y="208" width="160" height="40"/>
  <text class="text" x="340" y="233">Run pH pump</text>
  <line class="line" x1="340" y1="248" x2="340" y2="268"/>
  <rect class="box" x="260" y="268" width="160" height="36"/>
  <text class="text" x="340" y="290">Wait (mixing)</text>
  <line class="line" x1="340" y1="304" x2="340" y2="324"/>
  <rect class="box" x="260" y="324" width="160" height="40"/>
  <text class="text" x="340" y="349">Re-read pH</text>
  <line class="line" x1="140" y1="364" x2="140" y2="400"/>
  <line class="line" x1="340" y1="364" x2="340" y2="400"/>
  <line class="line" x1="140" y1="400" x2="340" y2="400"/>
  <line class="line" x1="240" y1="400" x2="240" y2="430"/>
  <rect class="box-end" x="120" y="430" width="240" height="44"/>
  <text class="text-white" x="240" y="450" font-size="12">Stop when target reached</text>
  <text class="text-white" x="240" y="466" font-size="12">or max cycles exceeded</text>
  <rect x="100" y="500" width="280" height="60" fill="#F4F6F8" stroke="#CCCCCC" stroke-width="1" rx="4"/>
  <text class="text" x="240" y="525" font-size="12" fill="#666">PH Control Mode selects base,</text>
  <text class="text" x="240" y="545" font-size="12" fill="#666">acid, or bidirectional correction</text>
</svg>
