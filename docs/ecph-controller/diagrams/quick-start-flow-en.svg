<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" width="360" height="720">
  <rect width="360" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0057B8"/>
    </marker>
  </defs>
  <style>
    .box { fill: #F4F6F8; stroke: #0057B8; stroke-width: 2; rx: 6; }
    .box-end { fill: #1FA463; stroke: #1FA463; stroke-width: 2; rx: 6; }
    .text { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #333333; text-anchor: middle; }
    .text-white { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #FFFFFF; text-anchor: middle; font-weight: bold; }
    .line { stroke: #0057B8; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>
  <rect class="box" x="40" y="20" width="280" height="44"/>
  <text class="text" x="180" y="47">Install equipment</text>
  <line class="line" x1="180" y1="64" x2="180" y2="84"/>
  <rect class="box" x="40" y="84" width="280" height="44"/>
  <text class="text" x="180" y="111">Connect EC / pH probes</text>
  <line class="line" x1="180" y1="128" x2="180" y2="148"/>
  <rect class="box" x="40" y="148" width="280" height="44"/>
  <text class="text" x="180" y="175">Connect A/B/C and pH pumps</text>
  <line class="line" x1="180" y1="192" x2="180" y2="212"/>
  <rect class="box" x="40" y="212" width="280" height="44"/>
  <text class="text" x="180" y="232">Open Manual page</text>
  <text class="text" x="180" y="248" font-size="12" fill="#666">Test outputs</text>
  <line class="line" x1="180" y1="256" x2="180" y2="276"/>
  <rect class="box" x="40" y="276" width="280" height="44"/>
  <text class="text" x="180" y="296">Open Parameter Set page</text>
  <text class="text" x="180" y="312" font-size="12" fill="#666">Set parameters</text>
  <line class="line" x1="180" y1="320" x2="180" y2="340"/>
  <rect class="box" x="40" y="340" width="280" height="44"/>
  <text class="text" x="180" y="360">Open Calibration page</text>
  <text class="text" x="180" y="376" font-size="12" fill="#666">Calibrate probes</text>
  <line class="line" x1="180" y1="384" x2="180" y2="404"/>
  <rect class="box" x="40" y="404" width="280" height="44"/>
  <text class="text" x="180" y="424">Return to Monitoring</text>
  <text class="text" x="180" y="440" font-size="12" fill="#666">Press Start</text>
  <line class="line" x1="180" y1="448" x2="180" y2="468"/>
  <rect class="box-end" x="40" y="468" width="280" height="44"/>
  <text class="text-white" x="180" y="495">Automatic run</text>
</svg>
