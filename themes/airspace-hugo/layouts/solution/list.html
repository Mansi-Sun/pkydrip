{{ define "main" }}

{{/* Hero / Banner with background image */}}
{{ $bg := "" }}
{{ with .Params.bg_image }}
  {{ $bg = . | relURL }}
{{ end }}

<section class="page-title-area"
  {{ if $bg }}style="background-image:url('{{ $bg }}'); background-size:cover; background-position:center; background-repeat:no-repeat;"{{ end }}>
  <div style="background: rgba(0,0,0,0.35); padding: 70px 0;">
    <div class="container">
      <h1 style="color:#fff; margin:0; font-weight:700;">
        {{ .Title }}
      </h1>
      {{ with .Params.description }}
        <p style="color: rgba(255,255,255,0.9); margin: 12px 0 0; max-width: 900px;">
          {{ . }}
        </p>
      {{ end }}
    </div>
  </div>
</section>

{{/* Main content (no post list) */}}
<section style="padding: 50px 0;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-10 col-xl-9">
        <div class="content">
          {{ .Content }}
        </div>
      </div>
    </div>
  </div>
</section>

{{ end }}
