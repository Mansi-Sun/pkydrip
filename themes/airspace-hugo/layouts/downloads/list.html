{{ define "main" }}

<section class="section">
  <div class="container">

    <h1>{{ .Title }}</h1>
    <p>{{ .Description }}</p>

    <div class="downloads-grid">

      {{ range .Site.RegularPages }}
        {{ if .Params.downloads }}
          <div class="download-card">

            <h2>{{ .Title }}</h2>

            <ul>
              {{ range .Params.downloads }}
              <li class="download-item">
                <span class="download-name">{{ .name }}</span>
                <span class="download-type">{{ .type }}</span>
                <a class="download-btn" href="{{ .file }}" target="_blank" download>
                  Download
                </a>
              </li>
              {{ end }}
            </ul>

          </div>
        {{ end }}
      {{ end }}

    </div>

  </div>
</section>

<style>
.downloads-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  grid-gap: 24px;
}

.download-card {
  background: #fff;
  padding: 24px;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}

.download-card h2 {
  margin-bottom: 16px;
}

.download-item {
  display: flex;
  justify-content: space-between;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid #e6e6e6;
}

.download-type {
  font-size: 0.9em;
  color: #00a29a;
  padding-right: 10px;
}

.download-btn {
  background: #00a29a;
  color: white;
  padding: 6px 12px;
  border-radius: 8px;
  text-decoration: none;
  font-size: 0.9em;
}
</style>

{{ end }}
