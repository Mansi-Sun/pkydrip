      - модернизация системы орошения
      - автоматизация старого полива
    primary_landing: /ru/landing-irrigation-upgrade/
    secondary_landing: /ru/irrigation-control-system/

  fertigation:
    name: Fertigation (Lower Priority)
    priority: low
    keywords_en:
      - fertigation system Russia
      - fertilizer injection system
      - EC pH control system
    keywords_ru:
      - система внесения удобрений
    primary_landing: /ru/fertigation-system/
    secondary_landing: /ru/landing-irrigation-upgrade/

