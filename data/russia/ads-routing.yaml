# PKYDrip Russia Ads-to-Lead Routing System
# Traffic Source → Keyword Cluster → Landing Page → WhatsApp/Telegram
# DO NOT use for English site. Russia /ru/ section only.

priority:
  high:
    - path: /ru/landing-irrigation-upgrade/
      label: Farm Irrigation Upgrade
      conversion_tier: 1
    - path: /ru/landing-wireless-farm/
      label: Wireless Farm Solution
      conversion_tier: 2
  mid:
    - path: /ru/irrigation-control-system/
      label: Irrigation Control System
      conversion_tier: 3
    - path: /ru/wireless-irrigation-system/
      label: Wireless Irrigation System
      conversion_tier: 4
  low:
    - path: /ru/fertigation-system/
      label: Fertigation System
      conversion_tier: 5

clusters:
  irrigation_control:
    name: Irrigation Control
    priority: mid
    keywords_en:
      - irrigation system Russia
      - farm irrigation control system
      - large field irrigation automation
    keywords_ru:
      - система орошения фермы
      - автоматизация полива поля
    primary_landing: /ru/irrigation-control-system/
    secondary_landing: /ru/landing-irrigation-upgrade/

  wireless_lora:
    name: Wireless Irrigation (LoRa)
    priority: mid
    keywords_en:
      - wireless irrigation system Russia
      - LoRa irrigation system
      - remote farm irrigation control
    keywords_ru:
      - беспроводная система полива
      - LoRa сельское хозяйство
    primary_landing: /ru/wireless-irrigation-system/
    secondary_landing: /ru/landing-wireless-farm/

  farm_upgrade:
    name: Farm Upgrade (High Conversion)
    priority: high
    keywords_en:
      - upgrade irrigation system
      - modernize farm irrigation Russia
      - replace manual irrigation system
    keywords_ru:
      - модернизация системы орошения
      - автоматизация старого полива
    primary_landing: /ru/landing-irrigation-upgrade/
    secondary_landing: /ru/irrigation-control-system/

  fertigation:
    name: Fertigation (Lower Priority)
    priority: low
    keywords_en:
      - fertigation system Russia
      - fertilizer injection system
      - EC pH control system
    keywords_ru:
      - система внесения удобрений
    primary_landing: /ru/fertigation-system/
    secondary_landing: /ru/landing-irrigation-upgrade/

contact:
  telegram: "https://t.me/+8617395297329"
  whatsapp: "https://wa.me/8617395297329"
  preferred_order:
    - telegram
    - whatsapp
  email_priority: secondary

