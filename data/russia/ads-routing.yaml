    secondary_landing: /ru/landing-wireless-farm/

  farm_upgrade:
    name: Farm Upgrade (High Conversion)
    priority: high
    keywords_en:
      - upgrade irrigation system
      - modernize farm irrigation Russia
      - replace manual irrigation system
