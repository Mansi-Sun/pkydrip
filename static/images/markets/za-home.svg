<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="South Africa agricultural system infrastructure">
  <rect width="1200" height="520" fill="#e8ede4"/>
  <text x="48" y="44" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#2a3828">South Africa  Agricultural System Infrastructure</text>
  <text x="48" y="70" font-family="Arial,sans-serif" font-size="13" fill="#5a6858">Solar-powered zones · off-grid farmland · distributed water systems</text>
  <rect x="48" y="88" width="1104" height="100" rx="12" fill="#fff" stroke="#c8d4c0"/>
  <text x="68" y="114" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#5a6858">LAYER 1  GEOGRAPHY</text>
  <rect x="80" y="128" width="200" height="44" rx="8" fill="#dce8dc" stroke="#a8c4a8"/><text x="180" y="156" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#3d5a48">Off-grid farmland</text>
  <rect x="300" y="128" width="200" height="44" rx="8" fill="#faf0d8" stroke="#d4b878"/><text x="400" y="156" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#6a5830">Solar irrigation zones</text>
  <rect x="520" y="128" width="200" height="44" rx="8" fill="#e8f3fa" stroke="#a8c8d8"/><text x="620" y="156" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#3d6070">Distributed water</text>
  <rect x="48" y="208" width="1104" height="140" rx="12" fill="#fff" stroke="#c8d4c0"/>
  <text x="68" y="234" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#5a6858">LAYER 2  SYSTEM FOCUS</text>
  <rect x="180" y="248" width="200" height="78" rx="10" fill="#faf0d8" stroke="#d4a84a"/><text x="280" y="292" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#6a5830">Solar irrigation</text>
  <rect x="420" y="248" width="200" height="78" rx="10" fill="#e8f3fa" stroke="#4a9fd4"/><text x="520" y="292" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#2f6a90">Control layer</text>
