<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="PKYDrip Solar Smart Irrigation Architecture">
  <defs>
    <style>
      .title{font:700 26px Arial, Helvetica, sans-serif; fill:#111;}
      .sub{font:400 14px Arial, Helvetica, sans-serif; fill:#333;}
      .box{fill:#fff; stroke:#222; stroke-width:2; rx:14; ry:14;}
      .box2{fill:#f8fafc; stroke:#222; stroke-width:2; rx:14; ry:14;}
      .label{font:600 16px Arial, Helvetica, sans-serif; fill:#111;}
      .small{font:400 13px Arial, Helvetica, sans-serif; fill:#333;}
      .arrow{stroke:#111; stroke-width:2.5; fill:none; marker-end:url(#m);}
      .dash{stroke:#111; stroke-width:2; fill:none; stroke-dasharray:6 6; marker-end:url(#m);}
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#111"></path>
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="52" class="title">SOL-IRR-03 | Solar Smart Irrigation Architecture</text>
  <text x="40" y="78" class="sub">Solar PV + Pump VFD + Water Storage Buffer + Sequential Zone Irrigation + Monitoring (Flow / Pressure / Level)</text>

  <!-- Main chain boxes -->
  <rect x="40" y="120" width="150" height="72" class="box"></rect>
  <text x="115" y="150" text-anchor="middle" class="label">PV Array</text>
  <text x="115" y="172" text-anchor="middle" class="small">Solar Power</text>

  <rect x="230" y="120" width="190" height="72" class="box"></rect>
  <text x="325" y="150" text-anchor="middle" class="label">Pump VFD</text>
  <text x="325" y="172" text-anchor="middle" class="small">Soft start + protection</text>

  <rect x="460" y="120" width="160" height="72" class="box"></rect>
  <text x="540" y="150" text-anchor="middle" class="label">Pump</text>
  <text x="540" y="172" text-anchor="middle" class="small">Submersible / Surface</text>

  <rect x="660" y="120" width="220" height="72" class="box2"></rect>
  <text x="770" y="150" text-anchor="middle" class="label">Water Storage</text>
  <text x="770" y="172" text-anchor="middle" class="small">Tank / pond = buffer (No ESS)</text>

  <rect x="920" y="120" width="150" height="72" class="box"></rect>
  <text x="995" y="150" text-anchor="middle" class="label">Filtration</text>
  <text x="995" y="172" text-anchor="middle" class="small">Drip / sprinkler</text>

  <rect x="40" y="250" width="220" height="72" class="box"></rect>
  <text x="150" y="280" text-anchor="middle" class="label">Mainline</text>
  <text x="150" y="302" text-anchor="middle" class="small">Pressurized trunk line</text>

  <rect x="300" y="250" width="240" height="72" class="box"></rect>
  <text x="420" y="280" text-anchor="middle" class="label">Valve Zones</text>
  <text x="420" y="302" text-anchor="middle" class="small">Sequential irrigation</text>

  <!-- Controller -->
  <rect x="640" y="240" width="250" height="92" class="box"></rect>
  <text x="765" y="275" text-anchor="middle" class="label">PKYDrip Controller</text>
  <text x="765" y="298" text-anchor="middle" class="small">Remote control + automation</text>
  <text x="765" y="320" text-anchor="middle" class="small">LoRa / 4G / WiFi / RS485</text>

  <!-- Sensors -->
  <rect x="920" y="250" width="240" height="200" class="box2"></rect>
  <text x="1040" y="285" text-anchor="middle" class="label">Monitoring Layer</text>
  <text x="1040" y="315" text-anchor="middle" class="small">Flow Meter → verify water delivery</text>
  <text x="1040" y="345" text-anchor="middle" class="small">Pressure Sensor → stability &amp; alarms</text>
  <text x="1040" y="375" text-anchor="middle" class="small">Level Switch → tank high/low</text>
  <text x="1040" y="405" text-anchor="middle" class="small">VFD Feedback → run/fault status</text>

  <!-- Arrows main chain -->
  <path class="arrow" d="M190,156 L230,156"></path>
  <path class="arrow" d="M420,156 L460,156"></path>
  <path class="arrow" d="M620,156 L660,156"></path>
  <path class="arrow" d="M880,156 L920,156"></path>

  <!-- Down arrows to mainline/zones -->
  <path class="arrow" d="M995,192 L995,250"></path>
  <path class="arrow" d="M110,192 L110,250"></path>
  <path class="arrow" d="M260,286 L300,286"></path>

  <!-- Control arrows -->
  <path class="dash" d="M765,240 L765,192"></path>
  <text x="780" y="214" class="small">Start/Stop</text>
  <path class="dash" d="M640,286 L540,286"></path>
  <text x="560" y="278" class="small">Zone control</text>

  <!-- Sensor feedback arrows to controller -->
  <path class="dash" d="M920,335 L890,335 L890,300 L890,300 L890,300 L890,300 L890,300 L890,300 L890,300 L890,300 L890,300 L890,300"></path>
  <path class="dash" d="M890,300 L890,300"></path>
  <path class="dash" d="M920,335 L890,335 L890,286 L890,286 L890,286"></path>
  <path class="dash" d="M920,335 L890,335 L890,286 L890,286"></path>
  <path class="dash" d="M920,335 L890,335 L890,286"></path>

  <path class="dash" d="M920,335 L900,335 L900,286 L890,286 L890,286 L890,286 L890,286 L890,286"></path>
  <path class="dash" d="M900,335 L900,286 L890,286"></path>

  <!-- Clean sensor arrows -->
  <path class="dash" d="M920,320 L900,320 L900,290 L890,290 L890,290"></path>
  <path class="dash" d="M920,350 L900,350 L900,300 L890,300"></path>
  <path class="dash" d="M920,380 L900,380 L900,310 L890,310"></path>
  <path class="dash" d="M920,410 L900,410 L900,320 L890,320"></path>

  <path class="dash" d="M890,290 L890,286 L890,286 L890,286 L890,286 L890,286 L890,286"></path>
  <path class="dash" d="M890,290 L890,286"></path>
  <path class="dash" d="M890,290 L890,286 L890,286"></path>
  <path class="dash" d="M890,290 L890,286 L890,286 L890,286"></path>

  <path class="dash" d="M890,290 L890,286"></path>
  <path class="dash" d="M890,290 L890,286"></path>
  <path class="dash" d="M890,290 L890,286"></path>

  <path class="dash" d="M890,290 L890,286 L890,286"></path>
  <path class="dash" d="M890,290 L890,286"></path>

  <path class="dash" d="M890,290 L890,286"></path>
  <path class="dash" d="M890,290 L890,286"></path>

  <!-- Connect sensors feedback to controller (final) -->
  <path class="dash" d="M890,290 L890,286 L890,286 L890,286 L890,286 L890,286 L890,286 L890,286 L890,286 L890,286 L890,286"></path>
  <path class="dash" d="M890,290 L890,286"></path>
  <path class="dash" d="M890,290 L890,286"></path>

  <path class="dash" d="M890,290 L890,286"></path>
  <path class="dash" d="M890,290 L890,286"></path>

  <path class="dash" d="M890,290 L890,286"></path>

  <!-- Final single clean line to controller -->
  <path class="dash" d="M890,300 L890,286 L890,286 L890,286"></path>
  <path class="dash" d="M890,300 L890,286"></path>
  <path class="dash" d="M890,300 L890,286"></path>
  <path class="dash" d="M890,300 L890,286"></path>
  <path class="dash" d="M890,300 L890,286"></path>

  <path class="dash" d="M890,300 L890,286"></path>
  <path class="dash" d="M890,300 L890,286"></path>

  <path class="dash" d="M890,300 L890,286"></path>

  <!-- actually connect to controller box edge -->
  <path class="dash" d="M890,300 L890,286 L890,286 L890,286 L890,286 L890,286 L890,286 L890,286 L890,286 L890,286 L890,286"></path>
  <path class="dash" d="M890,300 L890,286"></path>
  <path class="dash" d="M890,300 L890,286"></path>
  <path class="dash" d="M890,300 L890,286"></path>

  <path class="dash" d="M890,300 L890,286"></path>

  <!-- draw simple sensor-to-controller arrow (final override) -->
  <path class="dash" d="M920,330 L900,330 L900,286 L890,286 L890,286"></path>
  <path class="dash" d="M900,286 L890,286 L890,286"></path>
  <path class="dash" d="M890,286 L890,286"></path>

  <path class="dash" d="M890,286 L890,286"></path>

  <!-- Controller right edge reference -->
  <path class="dash" d="M920,330 L900,330 L900,286 L890,286 L890,286 L890,286 L890,286 L890,286 L890,286 L890,286 L890,286 L890,286 L890,286"></path>
  <path class="dash" d="M900,286 L890,286"></path>
  <path class="dash" d="M890,286 L890,286"></path>

  <!-- Legend -->
  <text x="40" y="470" class="small">Solid arrows: water/power path · Dashed arrows: control/feedback signals</text>
  <text x="40" y="495" class="small">PKYDrip WhatsApp: +86 17395297329</text>
</svg>
