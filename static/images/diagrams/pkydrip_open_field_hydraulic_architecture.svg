<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420">
  <defs>
    <style><![CDATA[
      .box { fill:#fff; stroke:#111; stroke-width:2; rx:14; ry:14; }
      .title { font:700 16px Arial, sans-serif; fill:#111; }
      .text { font:400 12px Arial, sans-serif; fill:#222; }
      .arrow { stroke:#111; stroke-width:2; fill:none; marker-end:url(#ah); }
      .note { font:400 11px Arial, sans-serif; fill:#444; }
    ]]></style>
    <marker id="ah" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#111"/>
    </marker>
  </defs>

  <text x="30" y="34" class="title">Open-Field Irrigation — Standard Hydraulic Architecture</text>
  <text x="30" y="58" class="note">Engineering reference: filtration + zoning structure for drip/sprinkler projects (5–50 ha).</text>

  <rect x="30"  y="110" width="185" height="78" class="box"/>
  <text x="45" y="140" class="title">Water Source</text>
  <text x="45" y="162" class="text">Bore / river / tank</text>

  <rect x="250" y="110" width="185" height="78" class="box"/>
  <text x="265" y="140" class="title">Pump Station</text>
  <text x="265" y="162" class="text">Flow + pressure supply</text>

  <rect x="470" y="110" width="185" height="78" class="box"/>
  <text x="485" y="140" class="title">Sand Filter</text>
  <text x="485" y="162" class="text">Media filtration</text>

  <rect x="690" y="110" width="185" height="78" class="box"/>
  <text x="705" y="140" class="title">Disc Filter</text>
  <text x="705" y="162" class="text">Fine filtration</text>

  <rect x="910" y="110" width="215" height="78" class="box"/>
  <text x="925" y="140" class="title">Fertigation (Optional)</text>
  <text x="925" y="162" class="text">Injection / EC-pH (if used)</text>

  <rect x="1160" y="110" width="185" height="78" class="box"/>
  <text x="1175" y="140" class="title">Mainline</text>
  <text x="1175" y="162" class="text">HDPE / PVC</text>

  <rect x="1380" y="110" width="185" height="78" class="box"/>
  <text x="1395" y="140" class="title">Zone Valves</text>
  <text x="1395" y="162" class="text">Zoning control</text>

  <rect x="1160" y="245" width="405" height="110" class="box"/>
  <text x="1175" y="275" class="title">Field Irrigation</text>
  <text x="1175" y="300" class="text">Drip lines / sprinklers deliver water to crops</text>
  <text x="1175" y="322" class="text">Design depends on crop, soil, pressure &amp; uniformity</text>

  <path d="M215 149 L250 149" class="arrow"/>
  <path d="M435 149 L470 149" class="arrow"/>
  <path d="M655 149 L690 149" class="arrow"/>
  <path d="M875 149 L910 149" class="arrow"/>
  <path d="M1125 149 L1160 149" class="arrow"/>
  <path d="M1345 149 L1380 149" class="arrow"/>
  <path d="M1472 188 L1472 245" class="arrow"/>

  <text x="30" y="390" class="note">Tip: Zoning reduces pump load and stabilizes pressure. Filtration protects emitters and valves.</text>
</svg>
