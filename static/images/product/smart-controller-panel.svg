<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="480" height="360" fill="#ffffff"/>
  <!-- wall-mount enclosure -->
  <rect x="130" y="18" width="220" height="324" rx="18" fill="#f3f6f4" stroke="#2e8b57" stroke-width="2.5"/>
  <text x="240" y="46" text-anchor="middle" font-size="12.5" font-weight="600" fill="#14532d">PKYDrip Smart Irrigation Controller</text>

  <!-- zone LED grid (4x4) -->
  <text x="240" y="72" text-anchor="middle" font-size="10.5" fill="#6b7280">Zone / valve status LEDs (16)</text>
  <g>
    <!-- 16 LEDs, 4 cols x 4 rows; first two green (open), rest gray (closed) -->
    <circle cx="185" cy="92" r="9" fill="#22c55e" stroke="#166534" stroke-width="1.5"/>
    <circle cx="222" cy="92" r="9" fill="#22c55e" stroke="#166534" stroke-width="1.5"/>
    <circle cx="259" cy="92" r="9" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
    <circle cx="296" cy="92" r="9" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
    <circle cx="185" cy="120" r="9" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
    <circle cx="222" cy="120" r="9" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
    <circle cx="259" cy="120" r="9" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
    <circle cx="296" cy="120" r="9" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
    <circle cx="185" cy="148" r="9" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
    <circle cx="222" cy="148" r="9" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
    <circle cx="259" cy="148" r="9" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
    <circle cx="296" cy="148" r="9" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
    <circle cx="185" cy="176" r="9" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
    <circle cx="222" cy="176" r="9" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
    <circle cx="259" cy="176" r="9" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
    <circle cx="296" cy="176" r="9" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
  </g>

  <!-- status LEDs row -->
  <text x="150" y="210" font-size="9.5" fill="#6b7280">RUN</text>
  <circle cx="150" cy="222" r="7" fill="#22c55e" stroke="#166534" stroke-width="1.2"/>
  <text x="200" y="210" font-size="9.5" fill="#6b7280">Wi-Fi</text>
  <circle cx="200" cy="222" r="7" fill="#60a5fa" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="252" y="210" font-size="9.5" fill="#6b7280">ERROR</text>
  <circle cx="252" cy="222" r="7" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.2"/>

  <!-- pump button -->
  <rect x="286" y="206" width="52" height="30" rx="8" fill="#fff" stroke="#2e8b57" stroke-width="2"/>
  <circle cx="302" cy="221" r="4.5" fill="#22c55e"/>
  <text x="315" y="225" text-anchor="middle" font-size="9.5" font-weight="600" fill="#14532d">PUMP</text>

  <!-- navigation buttons -->
  <rect x="170" y="250" width="46" height="46" rx="10" fill="#fff" stroke="#334155" stroke-width="2"/>
  <text x="193" y="280" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">&#8592;</text>
  <rect x="217" y="250" width="46" height="46" rx="10" fill="#2e8b57" stroke="#1f6b42" stroke-width="2"/>
  <text x="240" y="280" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">OK</text>
  <rect x="264" y="250" width="46" height="46" rx="10" fill="#fff" stroke="#334155" stroke-width="2"/>
  <text x="287" y="280" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">&#8594;</text>

  <text x="240" y="322" text-anchor="middle" font-size="9.5" fill="#6b7280">&#8592; / &#8594; select zone or option &#183; OK confirm &#183; green LED = valve open</text>

  <!-- caption outside -->
  <text x="66" y="150" font-size="10.5" fill="#6b7280" transform="rotate(-90 66 150)"> </text>
</svg>
