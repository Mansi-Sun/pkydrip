<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="680" height="320" fill="#ffffff"/>
  <text x="340" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Grow 16 · enclosure and power architecture</text>

  <!-- Grow 16 controller -->
  <rect x="30" y="110" width="170" height="100" rx="10" fill="#f0fdf4" stroke="#2e8b57" stroke-width="2"/>
  <text x="115" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">Grow 16</text>
  <text x="115" y="170" text-anchor="middle" font-size="11" fill="#374151">irrigation controller</text>
  <text x="115" y="188" text-anchor="middle" font-size="10" fill="#6b7280">MC-16 board inside</text>

  <!-- cables -->
  <line x1="200" y1="135" x2="290" y2="135" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <text x="245" y="122" text-anchor="middle" font-size="10.5" fill="#166534" font-weight="600">24 V power cable</text>
  <line x1="200" y1="185" x2="290" y2="185" stroke="#6b7280" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>
  <text x="245" y="207" text-anchor="middle" font-size="10.5" fill="#4b5563" font-weight="600">data cable</text>

  <!-- external power cabinet -->
  <rect x="292" y="105" width="178" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="381" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">External power cabinet</text>
  <text x="381" y="160" text-anchor="middle" font-size="10.5" fill="#374151">contactors · protection</text>
  <text x="381" y="178" text-anchor="middle" font-size="10.5" fill="#374151">VFD · power devices</text>

  <defs>
    <marker id="arrowG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2e8b57"/>
    </marker>
    <marker id="arrowGray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6b7280"/>
    </marker>
    <marker id="arrowDark" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
  </defs>

  <!-- outputs -->
  <line x1="470" y1="135" x2="530" y2="90" stroke="#334155" stroke-width="2" marker-end="url(#arrowDark)"/>
  <line x1="470" y1="160" x2="530" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#arrowDark)"/>
  <line x1="470" y1="185" x2="530" y2="230" stroke="#334155" stroke-width="2" marker-end="url(#arrowDark)"/>

  <rect x="532" y="62" width="120" height="52" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="592" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">Pump</text>
  <text x="592" y="102" text-anchor="middle" font-size="10" fill="#6b7280">single or multiple</text>

  <rect x="532" y="136" width="120" height="52" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="592" y="158" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">16 zone valves</text>
  <text x="592" y="176" text-anchor="middle" font-size="10" fill="#6b7280">AC / DC solenoids</text>

  <rect x="532" y="208" width="120" height="52" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="592" y="230" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">Extensions</text>
  <text x="592" y="248" text-anchor="middle" font-size="10" fill="#6b7280">VFD · shading · more</text>

  <!-- footnote -->
  <text x="340" y="298" text-anchor="middle" font-size="10.5" fill="#6b7280">Standard enclosure 400 × 500 × 200 mm — single-pump projects may divide it internally; larger projects add the external cabinet.</text>
</svg>
