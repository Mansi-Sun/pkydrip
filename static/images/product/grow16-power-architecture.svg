<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="680" height="460" fill="#ffffff"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Grow 16 · power architecture by project capacity</text>

  <defs>
    <marker id="arrowG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2e8b57"/>
    </marker>
    <marker id="arrowGray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6b7280"/>
    </marker>
    <marker id="arrowDark" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
  </defs>

  <!-- ============ Row 1: up to 2 kW ============ -->
  <rect x="18" y="52" width="120" height="72" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="78" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">≤ 3 kW</text>
  <text x="78" y="99" text-anchor="middle" font-size="10" fill="#6b7280">contactor start</text>
  <text x="78" y="114" text-anchor="middle" font-size="10" fill="#6b7280">no VFD</text>

  <rect x="160" y="46" width="200" height="84" rx="10" fill="#f0fdf4" stroke="#2e8b57" stroke-width="2"/>
  <text x="260" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">One combined cabinet</text>
  <text x="260" y="92" text-anchor="middle" font-size="10.5" fill="#374151">400 × 400 × 200 mm · up to 2 kW</text>
  <text x="260" y="110" text-anchor="middle" font-size="10.5" fill="#6b7280">control + power inside</text>

  <line x1="360" y1="88" x2="428" y2="88" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#arrowG)"/>

  <rect x="432" y="58" width="228" height="60" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="546" y="83" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">Submersible pump</text>
  <text x="546" y="102" text-anchor="middle" font-size="10" fill="#6b7280">direct-on-line start</text>

  <!-- ============ Row 2: above 3 kW ============ -->
  <rect x="18" y="182" width="120" height="72" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="78" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">&gt; 3 kW</text>
  <text x="78" y="229" text-anchor="middle" font-size="10" fill="#6b7280">farmland</text>
  <text x="78" y="244" text-anchor="middle" font-size="10" fill="#6b7280">pump station</text>

  <rect x="160" y="176" width="128" height="84" rx="10" fill="#f0fdf4" stroke="#2e8b57" stroke-width="2"/>
  <text x="224" y="204" text-anchor="middle" font-size="12.5" font-weight="600" fill="#14532d">Control cabinet</text>
  <text x="224" y="224" text-anchor="middle" font-size="10.5" fill="#374151">Grow 16 inside</text>
  <text x="224" y="242" text-anchor="middle" font-size="10.5" fill="#6b7280">compact · maintainable</text>

  <line x1="288" y1="206" x2="340" y2="206" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <line x1="288" y1="234" x2="340" y2="234" stroke="#6b7280" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>
  <text x="314" y="196" text-anchor="middle" font-size="9" fill="#166534" font-weight="600">24 V</text>
  <text x="314" y="252" text-anchor="middle" font-size="9" fill="#4b5563" font-weight="600">data</text>

  <rect x="344" y="176" width="128" height="84" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="408" y="204" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">Power cabinet</text>
  <text x="408" y="224" text-anchor="middle" font-size="10.5" fill="#374151">contactors · protection</text>
  <text x="408" y="242" text-anchor="middle" font-size="10.5" fill="#6b7280">VFD · power devices</text>

  <line x1="472" y1="218" x2="512" y2="218" stroke="#334155" stroke-width="2" marker-end="url(#arrowDark)"/>

  <rect x="516" y="188" width="144" height="60" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="588" y="213" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">Pumps 5–50 kW</text>
  <text x="588" y="232" text-anchor="middle" font-size="10" fill="#6b7280">larger power: case by case</text>

  <!-- ============ Row 3: climate above 100 kW ============ -->
  <rect x="18" y="312" width="120" height="72" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="78" y="340" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">&gt; 100 kW</text>
  <text x="78" y="359" text-anchor="middle" font-size="10" fill="#6b7280">cumulative load</text>
  <text x="78" y="374" text-anchor="middle" font-size="10" fill="#6b7280">greenhouse climate</text>

  <rect x="160" y="306" width="128" height="84" rx="10" fill="#f0fdf4" stroke="#2e8b57" stroke-width="2"/>
  <text x="224" y="330" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">Climate control</text>
  <text x="224" y="346" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">cabinet</text>
  <text x="224" y="366" text-anchor="middle" font-size="10.5" fill="#6b7280">Grow 16 platform</text>

  <line x1="288" y1="336" x2="340" y2="336" stroke="#2e8b57" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <line x1="288" y1="364" x2="340" y2="364" stroke="#6b7280" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>
  <text x="314" y="326" text-anchor="middle" font-size="9" fill="#166534" font-weight="600">DC 24 V</text>
  <text x="314" y="382" text-anchor="middle" font-size="9" fill="#4b5563" font-weight="600">RS485</text>

  <rect x="344" y="306" width="128" height="84" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="408" y="334" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">Power cabinet</text>
  <text x="408" y="354" text-anchor="middle" font-size="10.5" fill="#374151">group contactors</text>
  <text x="408" y="372" text-anchor="middle" font-size="10.5" fill="#6b7280">industrial relays</text>

  <line x1="472" y1="348" x2="512" y2="348" stroke="#334155" stroke-width="2" marker-end="url(#arrowDark)"/>

  <rect x="516" y="318" width="144" height="60" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="588" y="343" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">Fans · pads · vents</text>
  <text x="588" y="362" text-anchor="middle" font-size="10" fill="#6b7280">grouped starting</text>

  <!-- footnote -->
  <text x="340" y="428" text-anchor="middle" font-size="10.5" fill="#6b7280">Cabinets: customer-built, built from PKYDrip drawings, or supplied complete by PKYDrip.</text>
  <text x="340" y="444" text-anchor="middle" font-size="10.5" fill="#6b7280">Pumps up to 3 kW start directly with a contactor — confirm supply capacity on weak grids or small generators.</text>
</svg>
