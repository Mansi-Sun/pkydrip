# Netlify reads netlify.toml from the repository root only (not themes/airspace-hugo/netlify.toml).
# Use Hugo directly so deploys always regenerate public/ from content.
[build]
  publish = "public"
  command = "hugo version && hugo --gc --minify --forceSyncStatic"

[build.environment]
  # Match themes/airspace-hugo/netlify.toml; change if Netlify image drops this version.
  HUGO_VERSION = "0.115.1"
  HUGO_ENABLEGITINFO = "true"

# Permanently redirect the legacy www apex to the smart. subdomain, preserving the full path.
[[redirects]]
  from = "https://www.pky-dripirrigation.com/*"
  to = "https://smart.pky-dripirrigation.com/:splat"
  status = 301
  force = true

# Product page upgrade (0516): cabinet → pump & valve control system
[[redirects]]
  from = "/product/irrigation-control-cabinet/"
  to = "/product/pump-valve-control-system/"
  status = 301
  force = true

[[redirects]]
  from = "/product/irrigation-control-cabinet"
  to = "/product/pump-valve-control-system/"
  status = 301
  force = true

# System pages: legacy architecture URLs → canonical /system/ paths
[[redirects]]
  from = "/system-architecture/irrigation-control-system/"
  to = "/system/irrigation-control-system/"
  status = 301
  force = true

[[redirects]]
  from = "/system-architecture/fertigation-system/"
  to = "/system/fertigation-system/"
  status = 301
  force = true

[[redirects]]
  from = "/system-architecture/wireless-irrigation-system/"
  to = "/system/wireless-irrigation-system/"
  status = 301
  force = true
