# Netlify reads netlify.toml from the repository root only (not themes/airspace-hugo/netlify.toml).
# Use Hugo directly so deploys always regenerate public/ from content.
[build]
  publish = "public"
  command = "hugo version && hugo --gc --minify --forceSyncStatic"

[build.environment]
  # Must match local Hugo (extended). 0.115.x cannot build hugo.Data templates or current config.
  HUGO_VERSION = "0.161.1"
  NODE_VERSION = "22"
  HUGO_ENABLEGITINFO = "true"

# Permanently redirect the legacy www apex to the smart. subdomain, preserving the full path.
[[redirects]]
  from = "https://www.pky-dripirrigation.com/*"
  to = "https://smart.pky-dripirrigation.com/:splat"
  status = 301
  force = true

# Product page upgrade (0516): cabinet → pump & valve control system
[[redirects]]
  from = "/product/irrigation-control-cabinet/"
  to = "/product/pump-valve-control-system/"
  status = 301
  force = true

[[redirects]]
  from = "/product/irrigation-control-cabinet"
  to = "/product/pump-valve-control-system/"
