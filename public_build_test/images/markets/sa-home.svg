  <circle cx="300" cy="440" r="8" fill="#e8f3fa" stroke="#4a9fd4" stroke-width="1.8"/><circle cx="900" cy="440" r="8" fill="#e8f3fa" stroke="#4a9fd4" stroke-width="1.8"/>
