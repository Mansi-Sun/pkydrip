  <rect x="480" y="248" width="220" height="78" rx="10" fill="#eef4f8" stroke="#5a8aa8"/><text x="590" y="292" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#3d6a82">Wireless field network</text>
