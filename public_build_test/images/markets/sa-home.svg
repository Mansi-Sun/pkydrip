  <text x="48" y="70" font-family="Arial,sans-serif" font-size="13" fill="#6a5848">Large-scale desert agriculture · infrastructure zones · water network</text>
  <rect x="48" y="88" width="1104" height="100" rx="12" fill="#fff" stroke="#d8c8b0"/>
  <text x="68" y="114" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#6a5848">LAYER 1  GEOGRAPHY</text>
  <rect x="80" y="128" width="240" height="44" rx="8" fill="#e8ddd0" stroke="#c4a878"/><text x="200" y="156" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#5a4838">Desert farmland</text>
  <rect x="340" y="128" width="240" height="44" rx="8" fill="#e0d8c8" stroke="#b8a888"/><text x="460" y="156" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#5a4838">Large-scale blocks</text>
