<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #111; stroke-width: 2; rx: 14; }
      .title { font: 700 20px Arial, sans-serif; fill: #111; }
      .txt { font: 16px Arial, sans-serif; fill: #111; }
      .small { font: 14px Arial, sans-serif; fill: #111; }
      .line { stroke: #111; stroke-width: 2.2; fill: none; }
      .arrow { fill: #111; }
      .tag { font: 700 14px Arial, sans-serif; fill: #111; }
    </style>
  </defs>

  <text x="40" y="48" class="title">PKYDRIP Demonstration System - Architecture</text>

  <!-- Boxes -->
  <rect x="60" y="90" width="250" height="70" class="box"></rect>
  <text x="85" y="132" class="txt">Water Source / Tank</text>
  <text x="85" y="152" class="small">Lake intake demo / 100–200L loop</text>

  <rect x="360" y="90" width="210" height="70" class="box"></rect>
  <text x="390" y="132" class="txt">Pump</text>
  <text x="390" y="152" class="small">Start/Stop by controller</text>

  <rect x="620" y="70" width="220" height="65" class="box"></rect>
  <text x="645" y="108" class="txt">Pressure Sensor</text>
  <text x="645" y="128" class="small">Pipeline pressure</text>

  <rect x="620" y="150" width="220" height="65" class="box"></rect>
  <text x="645" y="188" class="txt">Flow Sensor</text>
  <text x="645" y="208" class="small">Real-time + Total</text>

  <rect x="860" y="105" width="210" height="90" class="box"></rect>
  <text x="885" y="145" class="txt">Main Pipeline</text>
  <text x="885" y="168" class="small">Manifold / fittings</text>

  <rect x="360" y="220" width="360" height="110" class="box"></rect>
  <text x="385" y="255" class="txt">PKYDRIP Irrigation Controller</text>
  <text x="385" y="280" class="small">Programs • Sequential valves • Monitoring</text>
  <text x="385" y="302" class="small">Protection: Over-pressure / Low-flow</text>

  <rect x="90" y="375" width="220" height="65" class="box"></rect>
  <text x="120" y="414" class="txt">Valve Zone 1</text>
  <text x="120" y="434" class="small">24V DC solenoid</text>

  <rect x="340" y="375" width="220" height="65" class="box"></rect>
  <text x="370" y="414" class="txt">Valve Zone 2</text>
  <text x="370" y="434" class="small">24V DC solenoid</text>

  <rect x="590" y="375" width="220" height="65" class="box"></rect>
  <text x="620" y="414" class="txt">Valve Zone 3</text>
  <text x="620" y="434" class="small">24V DC solenoid</text>

  <rect x="840" y="375" width="220" height="65" class="box"></rect>
  <text x="870" y="414" class="txt">Valve Zone 4</text>
  <text x="870" y="434" class="small">24V DC solenoid</text>

  <rect x="90" y="470" width="970" height="65" class="box"></rect>
  <text x="120" y="510" class="txt">Sprinkler Demonstration Zones (visible operation) + Return to Tank (closed loop)</text>

  <!-- Lines & arrows -->
  <path d="M310 125 L360 125" class="line"></path>
  <polygon points="360,125 350,119 350,131" class="arrow"></polygon>

  <path d="M570 125 L620 102" class="line"></path>
  <polygon points="620,102 608,100 613,111" class="arrow"></polygon>

  <path d="M570 125 L620 182" class="line"></path>
  <polygon points="620,182 609,176 614,194" class="arrow"></polygon>

  <path d="M840 102 L860 140" class="line"></path>
  <polygon points="860,140 850,133 868,129" class="arrow"></polygon>

  <path d="M840 182 L860 150" class="line"></path>
  <polygon points="860,150 868,141 850,145" class="arrow"></polygon>

  <path d="M965 195 L965 220 L720 220" class="line"></path>
  <polygon points="720,220 730,214 730,226" class="arrow"></polygon>

  <path d="M465 160 L465 220" class="line"></path>
  <polygon points="465,220 459,210 471,210" class="arrow"></polygon>

  <!-- Controller to valves -->
  <path d="M420 330 L200 375" class="line"></path>
  <polygon points="200,375 210,368 212,380" class="arrow"></polygon>

  <path d="M470 330 L450 375" class="line"></path>
  <polygon points="450,375 444,365 456,365" class="arrow"></polygon>

  <path d="M560 330 L700 375" class="line"></path>
  <polygon points="700,375 688,373 694,384" class="arrow"></polygon>

  <path d="M640 330 L950 375" class="line"></path>
  <polygon points="950,375 938,369 940,381" class="arrow"></polygon>

  <!-- Valves to sprinkler zones -->
  <path d="M200 440 L200 470" class="line"></path>
  <polygon points="200,470 194,460 206,460" class="arrow"></polygon>

  <path d="M450 440 L450 470" class="line"></path>
  <polygon points="450,470 444,460 456,460" class="arrow"></polygon>

  <path d="M700 440 L700 470" class="line"></path>
  <polygon points="700,470 694,460 706,460" class="arrow"></polygon>

  <path d="M950 440 L950 470" class="line"></path>
  <polygon points="950,470 944,460 956,460" class="arrow"></polygon>

  <!-- Note -->
  <text x="60" y="70" class="tag">Real sensors + real valve switching + protection logic</text>
</svg>