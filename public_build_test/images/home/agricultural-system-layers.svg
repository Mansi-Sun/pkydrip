<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-label="Agricultural automation system layer diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f9fb"/>
      <stop offset="100%" stop-color="#eef3f6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bg)" rx="18"/>
  <text x="60" y="52" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#243038">Agricultural System Layer Model</text>
  <text x="60" y="82" font-family="Arial,sans-serif" font-size="15" fill="#66737d">System thinking over equipment  environment, control layers, and agricultural output</text>

  <!-- Layer 1 Environment -->
  <rect x="60" y="110" width="1080" height="150" rx="16" fill="#ffffff" stroke="#d5dee6"/>
  <text x="88" y="142" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#5a6872">LAYER 1  ENVIRONMENT</text>
  <rect x="88" y="160" width="200" height="78" rx="12" fill="#e8f0ea" stroke="#c5d8cb"/>
  <text x="110" y="192" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#3d5a48">Climate Zones</text>
  <text x="110" y="214" font-family="Arial,sans-serif" font-size="12" fill="#607068">temperature · humidity · seasons</text>
  <rect x="320" y="160" width="220" height="78" rx="12" fill="#edf2ea" stroke="#cdd8c8"/>
  <text x="342" y="192" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#3d5a48">Farmland Regions</text>
  <text x="342" y="214" font-family="Arial,sans-serif" font-size="12" fill="#607068">fields · blocks · crop areas</text>
  <rect x="572" y="160" width="220" height="78" rx="12" fill="#eef3f0" stroke="#cdd8d0"/>
  <text x="594" y="192" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#3d5a48">Soil Abstraction</text>
  <text x="594" y="214" font-family="Arial,sans-serif" font-size="12" fill="#607068">moisture · terrain · zones</text>
  <rect x="824" y="160" width="280" height="78" rx="12" fill="#eef4f7" stroke="#cdd8e0"/>
  <text x="846" y="192" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#3d5560">Regional Context</text>
  <text x="846" y="214" font-family="Arial,sans-serif" font-size="12" fill="#607078">global farms · local configuration</text>

  <!-- connectors -->
  <line x1="600" y1="260" x2="600" y2="290" stroke="#9aabb5" stroke-width="2"/>
  <polygon points="600,290 594,278 606,278" fill="#9aabb5"/>

  <!-- Layer 2 Control -->
  <rect x="60" y="300" width="1080" height="190" rx="16" fill="#ffffff" stroke="#d5dee6"/>
  <text x="88" y="332" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#5a6872">LAYER 2  CONTROL SYSTEMS</text>
  <rect x="88" y="350" width="230" height="110" rx="12" fill="#e8f3fa" stroke="#b8d4e8"/>
  <text x="110" y="382" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#2f5f78">Irrigation System</text>
  <text x="110" y="406" font-family="Arial,sans-serif" font-size="12" fill="#5a7080">zone flow · scheduling · regions</text>
  <line x1="110" y1="422" x2="290" y2="422" stroke="#4a9fd4" stroke-width="2.5" opacity="0.7"/>
  <rect x="348" y="350" width="230" height="110" rx="12" fill="#faf4e8" stroke="#e0d4b0"/>
  <text x="370" y="382" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#6a5830">Fertigation System</text>
  <text x="370" y="406" font-family="Arial,sans-serif" font-size="12" fill="#7a7060">nutrient flow · EC/pH logic</text>
  <line x1="370" y1="422" x2="550" y2="422" stroke="#c4a24a" stroke-width="2.2" stroke-dasharray="6 5" opacity="0.75"/>
  <rect x="608" y="350" width="230" height="110" rx="12" fill="#eef6f2" stroke="#c0d8cc"/>
  <text x="630" y="382" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#3d6a52">Climate Control</text>
  <text x="630" y="406" font-family="Arial,sans-serif" font-size="12" fill="#5a7068">ventilation · cooling · zones</text>
  <line x1="630" y1="422" x2="810" y2="422" stroke="#6a9a9f" stroke-width="2.2" opacity="0.7"/>
  <rect x="868" y="350" width="236" height="110" rx="12" fill="#f0f2f5" stroke="#ccd2da"/>
  <text x="890" y="382" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#455060">Data Network</text>
  <text x="890" y="406" font-family="Arial,sans-serif" font-size="12" fill="#667080">monitoring · coordination · links</text>
  <circle cx="920" cy="430" r="5" fill="#4a9fd4"/><circle cx="950" cy="430" r="5" fill="#c4a24a"/><circle cx="980" cy="430" r="5" fill="#6a9a9f"/>
  <line x1="920" y1="430" x2="980" y2="430" stroke="#aab4bc" stroke-width="1.5"/>

  <line x1="600" y1="490" x2="600" y2="520" stroke="#9aabb5" stroke-width="2"/>
  <polygon points="600,520 594,508 606,508" fill="#9aabb5"/>

  <!-- Layer 3 Output -->
  <rect x="60" y="530" width="1080" height="120" rx="16" fill="#ffffff" stroke="#d5dee6"/>
  <text x="88" y="562" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#5a6872">LAYER 3  AGRICULTURAL OUTPUT</text>
  <rect x="200" y="578" width="140" height="52" rx="10" fill="#edf5ea" stroke="#c8dcc0"/>
  <text x="270" y="610" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#4a6048">Crop yield</text>
  <rect x="390" y="578" width="140" height="52" rx="10" fill="#edf5ea" stroke="#c8dcc0"/>
  <text x="460" y="610" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#4a6048">Water efficiency</text>
  <rect x="580" y="578" width="140" height="52" rx="10" fill="#edf5ea" stroke="#c8dcc0"/>
  <text x="650" y="610" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#4a6048">Stable production</text>
  <rect x="770" y="578" width="140" height="52" rx="10" fill="#edf5ea" stroke="#c8dcc0"/>
  <text x="840" y="610" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#4a6048">Regional farms</text>
</svg>
