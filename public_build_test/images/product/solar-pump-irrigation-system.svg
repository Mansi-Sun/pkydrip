    <rect x="64" y="58" width="90" height="96" rx="12" fill="#eef4f7" stroke="#cbd8df" stroke-width="3"/>
    <rect x="80" y="74" width="58" height="26" rx="5" fill="#12384d"/>
    <circle cx="90" cy="124" r="8" fill="#2fb36d"/>
    <circle cx="112" cy="124" r="8" fill="#ffd36a"/>
