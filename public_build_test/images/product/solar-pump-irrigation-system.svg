      <rect x="118" y="38" width="34" height="14" rx="7" fill="#17415a"/>
      <rect x="72" y="0" width="30" height="28" rx="8" fill="#17415a"/>
    </g>
    <text x="24" y="156" fill="#62727c" font-family="Arial, Helvetica, sans-serif" font-size="14">Bore / river / reservoir</text>
  </g>

  <g transform="translate(960 184)" filter="url(#shadow)">
    <rect x="0" y="0" width="166" height="188" rx="24" fill="#ffffff"/>
    <text x="22" y="36" fill="#17415a" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Water Tank</text>
    <ellipse cx="83" cy="76" rx="48" ry="16" fill="#73c3ef"/>
    <rect x="35" y="76" width="96" height="76" fill="#2c8ed6"/>
    <ellipse cx="83" cy="152" rx="48" ry="16" fill="#145e9d"/>
    <path d="M35 76v76M131 76v76" stroke="#145e9d" stroke-width="3"/>
    <text x="22" y="174" fill="#62727c" font-family="Arial, Helvetica, sans-serif" font-size="14">Storage buffer</text>
  </g>

  <g stroke="#1f8f5a" stroke-width="7" fill="none" marker-end="url(#arrow)">
    <path d="M306 278H370"/>
    <path d="M604 278H674"/>
    <path d="M900 278H944"/>
  </g>

  <g transform="translate(246 450)" filter="url(#shadow)">
    <rect x="0" y="0" width="260" height="170" rx="24" fill="#ffffff"/>
    <text x="24" y="36" fill="#17415a" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Irrigation Controller</text>
    <rect x="30" y="58" width="88" height="82" rx="12" fill="#eef4f7" stroke="#cbd8df" stroke-width="3"/>
    <rect x="45" y="74" width="58" height="24" rx="5" fill="#12384d"/>
    <circle cx="54" cy="118" r="7" fill="#2fb36d"/>
    <circle cx="76" cy="118" r="7" fill="#ffd36a"/>
    <circle cx="98" cy="118" r="7" fill="#e45757"/>
    <g transform="translate(142 66)" fill="#5f6f79" font-family="Arial, Helvetica, sans-serif" font-size="14">
      <text x="0" y="0">Zone scheduling</text>
      <text x="0" y="30">Pump interlock</text>
      <text x="0" y="60">Valve sequence</text>
    </g>
  </g>

  <g transform="translate(586 450)" filter="url(#shadow)">
    <rect x="0" y="0" width="238" height="170" rx="24" fill="#ffffff"/>
    <text x="24" y="36" fill="#17415a" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Remote Valves</text>
    <g transform="translate(34 70)">
      <circle cx="22" cy="22" r="18" fill="#2fb36d"/>
      <rect x="40" y="14" width="54" height="16" rx="8" fill="#17415a"/>
      <circle cx="122" cy="22" r="18" fill="#2fb36d"/>
      <rect x="140" y="14" width="54" height="16" rx="8" fill="#17415a"/>
      <path d="M22 58v32M122 58v32" stroke="#1f8f5a" stroke-width="7" stroke-linecap="round"/>
    </g>
    <text x="24" y="142" fill="#62727c" font-family="Arial, Helvetica, sans-serif" font-size="14">LoRa field expansion</text>
  </g>

  <g transform="translate(910 450)" filter="url(#shadow)">
    <rect x="0" y="0" width="218" height="170" rx="24" fill="#ffffff"/>
    <text x="24" y="36" fill="#17415a" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Monitoring</text>
    <g transform="translate(34 62)">
      <rect x="0" y="0" width="150" height="78" rx="14" fill="url(#blue)"/>
      <polyline points="18,54 42,40 66,46 90,24 116,34 136,18" fill="none" stroke="#8ff0bd" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="18" y="28" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13">Tank / flow / pump</text>
    </g>
    <text x="24" y="142" fill="#62727c" font-family="Arial, Helvetica, sans-serif" font-size="14">App / web data optional</text>
  </g>

  <g stroke="#1f8f5a" stroke-width="7" fill="none" marker-end="url(#arrow)">
    <path d="M1044 372C1044 410 1018 430 978 450"/>
    <path d="M506 535H570"/>
    <path d="M824 535H894"/>
  </g>

  <g transform="translate(80 660)">
    <rect x="0" y="0" width="1040" height="54" rx="27" fill="#ffffff" opacity="0.88"/>
    <g fill="#17415a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">
      <text x="32" y="34">Solar power</text>
      <text x="214" y="34">Pump control</text>
      <text x="414" y="34">Tank storage</text>
      <text x="612" y="34">Irrigation automation</text>
      <text x="856" y="34">Remote monitoring</text>
    </g>
    <g fill="#2fb36d">
      <circle cx="18" cy="29" r="7"/>
      <circle cx="200" cy="29" r="7"/>
      <circle cx="400" cy="29" r="7"/>
      <circle cx="598" cy="29" r="7"/>
      <circle cx="842" cy="29" r="7"/>
