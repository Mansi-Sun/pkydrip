<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">PKYDrip solar pump irrigation system architecture</title>
  <desc id="desc">A custom solar pump irrigation system showing solar panels, pump controller, water pump, tank storage, irrigation controller, wireless valve control, monitoring, and field irrigation zones.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff4ff"/>
      <stop offset="0.55" stop-color="#f5fbff"/>
      <stop offset="1" stop-color="#eff8ef"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fb36d"/>
      <stop offset="1" stop-color="#1f8f5a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c8ed6"/>
      <stop offset="1" stop-color="#145e9d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#173444" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1f8f5a"/>
    </marker>
  </defs>

  <rect width="1200" height="760" rx="44" fill="url(#sky)"/>
  <circle cx="1040" cy="104" r="54" fill="#ffd36a"/>
  <g stroke="#ffd36a" stroke-width="7" stroke-linecap="round" opacity="0.75">
    <path d="M1040 18v34"/>
    <path d="M1040 156v34"/>
    <path d="M954 104h34"/>
    <path d="M1092 104h34"/>
    <path d="M978 42l24 24"/>
    <path d="M1078 142l24 24"/>
    <path d="M1102 42l-24 24"/>
    <path d="M1002 142l-24 24"/>
  </g>

  <g transform="translate(72 64)">
    <text x="0" y="0" fill="#17415a" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700">
      Solar Pump Irrigation System
    </text>
    <text x="0" y="44" fill="#5d6d78" font-family="Arial, Helvetica, sans-serif" font-size="20">
      Custom control architecture for solar pumping, water storage, irrigation automation, and remote monitoring.
    </text>
  </g>

  <path d="M0 610 C160 570 300 620 480 586 C650 552 780 610 970 576 C1070 558 1140 568 1200 548 L1200 760 L0 760Z" fill="#d9f0d6"/>
  <path d="M0 654 C180 622 345 664 530 636 C710 610 860 650 1200 620 L1200 760 L0 760Z" fill="#bfe5bf"/>

  <g transform="translate(76 190)" filter="url(#shadow)">
    <rect x="0" y="0" width="230" height="176" rx="24" fill="#ffffff"/>
    <text x="24" y="36" fill="#17415a" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Solar Panels</text>
    <g transform="translate(34 62) skewX(-12)">
      <rect x="0" y="0" width="156" height="82" rx="8" fill="#17415a"/>
      <g stroke="#79c8ff" stroke-width="3">
        <path d="M0 28h156"/>
        <path d="M0 56h156"/>
        <path d="M39 0v82"/>
        <path d="M78 0v82"/>
