<svg width="1800" height="1180" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill:#f6f8fb; }
    .panel { fill:#ffffff; stroke:#cfd8e3; stroke-width:2; rx:20; ry:20; }
    .box { fill:#eef3f8; stroke:#cfd8e3; stroke-width:2; rx:16; ry:16; }
    .zone1 { fill:#dfead9; stroke:#9fbc8c; stroke-width:2; rx:12; ry:12; }
    .zone2 { fill:#dbe6f2; stroke:#9fb4c9; stroke-width:2; rx:12; ry:12; }
    .zone3 { fill:#f4e5d6; stroke:#d2b394; stroke-width:2; rx:12; ry:12; }
    .zone4 { fill:#ece2f4; stroke:#bba3d0; stroke-width:2; rx:12; ry:12; }
    .soft { fill:#dbe6f2; stroke:#a6b7c8; stroke-width:1.5; rx:12; ry:12; }
    .title { font:700 40px Arial; fill:#1f2d3a; }
    .sub { font:20px Arial; fill:#5b6b79; }
    .h2 { font:700 24px Arial; fill:#1f2d3a; }
    .label { font:700 18px Arial; fill:#1f2d3a; }
    .body { font:18px Arial; fill:#4e5d6b; }
    .small { font:15px Arial; fill:#738190; }
    .line { stroke:#8ea4ba; stroke-width:3; }
    .dash { stroke:#a9b9c8; stroke-width:2; stroke-dasharray:8 6; }
    .tag { fill:#20364d; rx:10; ry:10; }
    .tagtext { font:700 14px Arial; fill:#ffffff; }
  </style>

  <rect width="1800" height="1180" class="bg"></rect>

  <text x="70" y="58" class="title">Open Field Irrigation Zoning Example</text>
  <text x="70" y="92" class="sub">Illustrative field layout showing how one irrigation system can be divided into manageable control zones</text>

  <rect x="50" y="130" width="1700" height="1000" class="panel"></rect>

  <rect x="1470" y="145" width="110" height="32" class="tag"></rect>
  <text x="1499" y="166" class="tagtext">Zoning</text>

  <rect x="1595" y="145" width="120" height="32" class="tag"></rect>
  <text x="1622" y="166" class="tagtext">Field layout</text>

  <!-- left explanation -->
  <text x="90" y="210" class="h2">Example Planning Logic</text>
  <text x="90" y="245" class="small">This is not a fixed farm drawing. It is a reusable concept for explaining open-field zoning.</text>

  <!-- main field -->
  <rect x="90" y="290" width="1100" height="700" class="box"></rect>
  <text x="105" y="325" class="small">Illustrative farm / orchard area</text>

  <!-- source and control -->
  <rect x="130" y="380" width="180" height="75" class="soft"></rect>
  <text x="165" y="425" class="label">Water Source</text>

  <rect x="130" y="500" width="180" height="75" class="soft"></rect>
  <text x="183" y="545" class="label">Pump</text>

  <rect x="130" y="620" width="180" height="75" class="soft"></rect>
  <text x="150" y="665" class="label">Controller</text>

  <line x1="220" y1="455" x2="220" y2="500" class="line"></line>
  <line x1="220" y1="575" x2="220" y2="620" class="line"></line>

  <line x1="310" y1="657" x2="420" y2="657" class="line"></line>
  <line x1="420" y1="657" x2="420" y2="360" class="line"></line>
  <line x1="420" y1="360" x2="1030" y2="360" class="line"></line>

  <!-- zone blocks -->
  <rect x="470" y="400" width="250" height="220" class="zone1"></rect>
  <text x="565" y="440" class="label">Zone 1</text>
  <text x="515" y="475" class="body">Example: orchard row section A</text>
  <text x="515" y="510" class="small">similar flow / pressure requirement</text>

  <rect x="760" y="400" width="250" height="220" class="zone2"></rect>
  <text x="855" y="440" class="label">Zone 2</text>
  <text x="805" y="475" class="body">Example: orchard row section B</text>
  <text x="805" y="510" class="small">similar irrigation duration</text>

  <rect x="470" y="670" width="250" height="220" class="zone3"></rect>
  <text x="565" y="710" class="label">Zone 3</text>
  <text x="520" y="745" class="body">Example: field crop block A</text>
  <text x="518" y="780" class="small">separate submain branch</text>

  <rect x="760" y="670" width="250" height="220" class="zone4"></rect>
  <text x="855" y="710" class="label">Zone 4</text>
  <text x="810" y="745" class="body">Example: field crop block B</text>
  <text x="808" y="780" class="small">expandable for later phases</text>

  <!-- branch lines -->
  <line x1="595" y1="360" x2="595" y2="400" class="line"></line>
  <line x1="885" y1="360" x2="885" y2="400" class="line"></line>
  <line x1="595" y1="620" x2="595" y2="670" class="line"></line>
  <line x1="885" y1="620" x2="885" y2="670" class="line"></line>
  <line x1="595" y1="620" x2="885" y2="620" class="line"></line>
  <line x1="595" y1="620" x2="595" y2="620" class="line"></line>
  <line x1="885" y1="620" x2="885" y2="620" class="line"></line>

  <!-- right panel -->
  <rect x="1240" y="290" width="470" height="700" class="box"></rect>
  <text x="1275" y="340" class="h2">Why Irrigation Is Divided into Zones</text>

  <rect x="1275" y="390" width="400" height="110" class="soft"></rect>
  <text x="1305" y="435" class="label">1. Pump Capacity Matching</text>
  <text x="1305" y="468" class="small">One pump may not economically run the whole field at once.</text>

  <rect x="1275" y="530" width="400" height="110" class="soft"></rect>
  <text x="1305" y="575" class="label">2. Hydraulic Stability</text>
  <text x="1305" y="608" class="small">Separate zones help keep pressure and flow within a workable range.</text>

  <rect x="1275" y="670" width="400" height="110" class="soft"></rect>
  <text x="1305" y="715" class="label">3. Operational Flexibility</text>
  <text x="1305" y="748" class="small">Different crop areas or field blocks can run on different schedules.</text>

  <rect x="1275" y="810" width="400" height="110" class="soft"></rect>
  <text x="1305" y="855" class="label">4. Easier Expansion</text>
  <text x="1305" y="888" class="small">New zones can be added later without redesigning the whole farm.</text>

  <!-- bottom -->
  <text x="90" y="1045" class="h2">Typical Zoning Factors</text>

  <rect x="90" y="1075" width="1620" height="70" class="panel"></rect>
  <text x="120" y="1117" class="body">crop type · field block size · pump flow · pipe layout · pressure loss · irrigation method · future expansion plan</text>
</svg>