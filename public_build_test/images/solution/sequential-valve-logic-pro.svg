<svg width="1800" height="1120" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill:#f6f8fb; }
    .panel { fill:#ffffff; stroke:#cfd8e3; stroke-width:2; rx:20; ry:20; }
    .box { fill:#eef3f8; stroke:#cfd8e3; stroke-width:2; rx:16; ry:16; }
    .soft { fill:#dbe6f2; stroke:#a6b7c8; stroke-width:1.5; rx:12; ry:12; }
    .active { fill:#dfead9; stroke:#9fbc8c; stroke-width:2; rx:12; ry:12; }
    .title { font:700 40px Arial; fill:#1f2d3a; }
    .sub { font:20px Arial; fill:#5b6b79; }
    .h2 { font:700 24px Arial; fill:#1f2d3a; }
    .label { font:700 18px Arial; fill:#1f2d3a; }
    .body { font:18px Arial; fill:#4e5d6b; }
    .small { font:15px Arial; fill:#738190; }
    .line { stroke:#8ea4ba; stroke-width:3; }
    .dash { stroke:#a9b9c8; stroke-width:2; stroke-dasharray:8 6; }
    .tag { fill:#20364d; rx:10; ry:10; }
    .tagtext { font:700 14px Arial; fill:#ffffff; }
  </style>

  <rect width="1800" height="1120" class="bg"></rect>

  <text x="70" y="58" class="title">Sequential Valve Irrigation Logic</text>
  <text x="70" y="92" class="sub">Typical workflow for one pump serving multiple irrigation zones in a controlled sequence</text>

  <rect x="50" y="130" width="1700" height="940" class="panel"></rect>

  <rect x="1480" y="145" width="110" height="32" class="tag"></rect>
  <text x="1510" y="166" class="tagtext">Logic</text>

  <rect x="1605" y="145" width="120" height="32" class="tag"></rect>
  <text x="1632" y="166" class="tagtext">Workflow</text>

  <!-- Left process -->
  <text x="90" y="210" class="h2">Step-by-Step Control Sequence</text>
  <text x="90" y="245" class="small">Readable for customers, distributors, and internal engineering explanation</text>

  <rect x="100" y="300" width="270" height="80" class="box"></rect>
  <text x="165" y="348" class="label">1. Start Program</text>
  <text x="128" y="372" class="small">scheduled or manual trigger</text>

  <rect x="100" y="420" width="270" height="80" class="box"></rect>
  <text x="155" y="468" class="label">2. Enable Pump</text>
  <text x="121" y="492" class="small">pump output / contactor logic</text>

  <rect x="100" y="540" width="270" height="80" class="active"></rect>
  <text x="140" y="588" class="label">3. Open Zone 1 Valve</text>
  <text x="122" y="612" class="small">first irrigation section begins</text>

  <rect x="100" y="660" width="270" height="80" class="box"></rect>
  <text x="140" y="708" class="label">4. Run for Set Time</text>
  <text x="130" y="732" class="small">example: 20 min or 45 min</text>

  <rect x="100" y="780" width="270" height="80" class="box"></rect>
  <text x="125" y="828" class="label">5. Close Zone 1 Valve</text>
  <text x="127" y="852" class="small">zone 1 irrigation completed</text>

  <rect x="100" y="900" width="270" height="80" class="box"></rect>
  <text x="122" y="948" class="label">6. Open Next Zone</text>
  <text x="125" y="972" class="small">zone 2 / zone 3 / zone 4 ...</text>

  <line x1="235" y1="380" x2="235" y2="420" class="line"></line>
  <line x1="235" y1="500" x2="235" y2="540" class="line"></line>
  <line x1="235" y1="620" x2="235" y2="660" class="line"></line>
  <line x1="235" y1="740" x2="235" y2="780" class="line"></line>
  <line x1="235" y1="860" x2="235" y2="900" class="line"></line>

  <!-- Center timeline -->
  <text x="500" y="210" class="h2">Illustrative Irrigation Timeline</text>
  <text x="500" y="245" class="small">Example showing one pump serving zones in sequence rather than all at once</text>

  <rect x="500" y="320" width="760" height="300" class="box"></rect>

  <!-- timeline headers -->
  <text x="620" y="365" class="label">Time</text>
  <text x="780" y="365" class="label">00:00–00:20</text>
  <text x="955" y="365" class="label">00:20–00:40</text>
  <text x="1130" y="365" class="label">00:40–01:00</text>

  <!-- row labels -->
  <text x="560" y="430" class="label">Pump</text>
  <text x="560" y="490" class="label">Zone 1</text>
  <text x="560" y="550" class="label">Zone 2</text>
  <text x="560" y="610" class="label">Zone 3</text>

  <!-- Pump blocks -->
  <rect x="760" y="405" width="500" height="35" class="active"></rect>
  <text x="965" y="428" class="small">pump running</text>

  <!-- Zone blocks -->
  <rect x="760" y="465" width="145" height="35" class="active"></rect>
  <rect x="935" y="465" width="145" height="35" class="soft"></rect>
  <rect x="1110" y="465" width="145" height="35" class="soft"></rect>

  <rect x="760" y="525" width="145" height="35" class="soft"></rect>
  <rect x="935" y="525" width="145" height="35" class="active"></rect>
  <rect x="1110" y="525" width="145" height="35" class="soft"></rect>

  <rect x="760" y="585" width="145" height="35" class="soft"></rect>
  <rect x="935" y="585" width="145" height="35" class="soft"></rect>
  <rect x="1110" y="585" width="145" height="35" class="active"></rect>

  <text x="800" y="488" class="small">ON</text>
  <text x="975" y="548" class="small">ON</text>
  <text x="1150" y="608" class="small">ON</text>

  <!-- Right notes -->
  <text x="1330" y="210" class="h2">Why This Logic Matters</text>

  <rect x="1320" y="300" width="360" height="120" class="soft"></rect>
  <text x="1350" y="345" class="label">One Pump, Multiple Zones</text>
  <text x="1350" y="378" class="small">Avoids oversizing hardware just to run all zones together.</text>

  <rect x="1320" y="450" width="360" height="120" class="soft"></rect>
  <text x="1350" y="495" class="label">Structured Water Distribution</text>
  <text x="1350" y="528" class="small">Each zone gets irrigation according to planned runtime.</text>

  <rect x="1320" y="600" width="360" height="120" class="soft"></rect>
  <text x="1350" y="645" class="label">Expandable Logic</text>
  <text x="1350" y="678" class="small">Can be extended with sensor triggers, alarms, and fertigation rules.</text>

  <!-- Bottom flow example -->
  <text x="500" y="700" class="h2">Example Sequence with Expansion Options</text>

  <rect x="500" y="760" width="1180" height="230" class="box"></rect>

  <rect x="540" y="820" width="150" height="60" class="soft"></rect>
  <text x="580" y="857" class="label">Program</text>

  <rect x="740" y="820" width="150" height="60" class="soft"></rect>
  <text x="785" y="857" class="label">Pump</text>

  <rect x="940" y="820" width="150" height="60" class="active"></rect>
  <text x="978" y="857" class="label">Zone 1</text>

  <rect x="1140" y="820" width="150" height="60" class="soft"></rect>
  <text x="1178" y="857" class="label">Zone 2</text>

  <rect x="1340" y="820" width="150" height="60" class="soft"></rect>
  <text x="1378" y="857" class="label">Zone 3</text>

  <line x1="690" y1="850" x2="740" y2="850" class="line"></line>
  <line x1="890" y1="850" x2="940" y2="850" class="line"></line>
  <line x1="1090" y1="850" x2="1140" y2="850" class="line"></line>
  <line x1="1290" y1="850" x2="1340" y2="850" class="line"></line>

  <line x1="1015" y1="760" x2="1015" y2="720" class="dash"></line>
  <rect x="930" y="665" width="170" height="55" class="soft"></rect>
  <text x="968" y="699" class="small">optional fertigation</text>

  <line x1="1415" y1="760" x2="1415" y2="720" class="dash"></line>
  <rect x="1325" y="665" width="180" height="55" class="soft"></rect>
  <text x="1368" y="699" class="small">optional sensors</text>
</svg>