<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <style><![CDATA[
      .box { fill:#fff; stroke:#111; stroke-width:2; rx:14; ry:14; }
      .box2 { fill:#f6f6f6; stroke:#111; stroke-width:2; rx:14; ry:14; }
      .title { font:700 16px Arial, sans-serif; fill:#111; }
      .text { font:400 12px Arial, sans-serif; fill:#222; }
      .note { font:400 11px Arial, sans-serif; fill:#444; }
      .arrow { stroke:#111; stroke-width:2; fill:none; marker-end:url(#ah); }
      .dash { stroke-dasharray:6 6; }
    ]]></style>
    <marker id="ah" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#111"/>
    </marker>
  </defs>

  <text x="30" y="34" class="title">Open-Field Irrigation — Control Architecture (Typical)</text>
  <text x="30" y="58" class="note">Engineering reference: master logic + gateway + distributed valve control. Optional sensors/cloud on demand.</text>

  <rect x="60" y="110" width="360" height="90" class="box"/>
  <text x="80" y="145" class="title">Master Controller</text>
  <text x="80" y="168" class="text">PKY-60W • schedules • sequential logic • alarms</text>

  <rect x="510" y="110" width="360" height="90" class="box"/>
  <text x="530" y="145" class="title">Gateway</text>
  <text x="530" y="168" class="text">PKY-EG08 • LoRa coordination (when LoRa is used)</text>

  <rect x="960" y="85" width="580" height="150" class="box2"/>
  <text x="980" y="120" class="title">Field Zone Control</text>

  <rect x="990" y="140" width="160" height="75" class="box"/>
  <text x="1005" y="170" class="title">IC05</text>
  <text x="1005" y="192" class="text">Zone valve</text>

  <rect x="1180" y="140" width="160" height="75" class="box"/>
  <text x="1195" y="170" class="title">IC05</text>
  <text x="1195" y="192" class="text">Zone valve</text>

  <rect x="1370" y="140" width="160" height="75" class="box"/>
  <text x="1385" y="170" class="title">IC05</text>
  <text x="1385" y="192" class="text">Zone valve</text>

  <rect x="60" y="285" width="360" height="95" class="box2"/>
  <text x="80" y="320" class="title">Optional Sensors</text>
  <text x="80" y="344" class="text">Soil moisture • pressure • flow • weather</text>

  <rect x="510" y="285" width="360" height="95" class="box2"/>
  <text x="530" y="320" class="title">Optional Cloud / Remote Monitoring</text>
  <text x="530" y="344" class="text">Used when project requires remote visibility</text>

  <rect x="960" y="285" width="580" height="95" class="box2"/>
  <text x="980" y="320" class="title">Pump / Protection Logic</text>
  <text x="980" y="344" class="text">Start/stop • dry-run protection • pressure monitoring</text>

  <path d="M420 155 L510 155" class="arrow"/>
  <path d="M870 155 L960 155" class="arrow"/>

  <path d="M240 200 L240 285" class="arrow"/>
  <path d="M690 200 L690 285" class="arrow"/>
  <path d="M1250 235 L1250 285" class="arrow"/>

  <path d="M420 332 L510 332" class="arrow dash"/>

  <text x="30" y="460" class="note">Note: LoRa is one communication option. The platform can also integrate RS485 and cloud connectivity when required by the project.</text>
</svg>
