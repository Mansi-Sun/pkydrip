<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
  <defs>
    <style>
      .title { font: 700 20px Arial, sans-serif; fill: #111; }
      .txt { font: 16px Arial, sans-serif; fill: #111; }
      .small { font: 14px Arial, sans-serif; fill: #111; }
      .box { fill: #fff; stroke: #111; stroke-width: 2; rx: 14; }
      .line { stroke: #111; stroke-width: 2.2; fill: none; }
      .arrow { fill: #111; }
      .note { font: 700 14px Arial, sans-serif; fill: #111; }
    </style>
  </defs>

  <text x="40" y="48" class="title">Wiring Reference (Quick Guide for Contractors)</text>
  <text x="40" y="76" class="small">Final wiring must follow controller I/O specification and local compliance standards.</text>

  <rect x="90" y="140" width="320" height="110" class="box"></rect>
  <text x="120" y="185" class="txt">PKYDRIP Controller</text>
  <text x="120" y="210" class="small">Zone outputs (24V DC)</text>
  <text x="120" y="232" class="small">Pump relay / contactor control</text>

  <rect x="500" y="90" width="260" height="80" class="box"></rect>
  <text x="530" y="135" class="txt">Pump Relay / Contactor</text>
  <text x="530" y="158" class="small">Start/Stop control</text>

  <rect x="820" y="90" width="220" height="80" class="box"></rect>
  <text x="850" y="135" class="txt">Pump</text>
  <text x="850" y="158" class="small">AC/DC per demo</text>

  <rect x="500" y="210" width="260" height="80" class="box"></rect>
  <text x="530" y="255" class="txt">Flow Sensor</text>
  <text x="530" y="278" class="small">Pulse / RS485</text>

  <rect x="500" y="330" width="260" height="80" class="box"></rect>
  <text x="530" y="375" class="txt">Pressure Sensor</text>
  <text x="530" y="398" class="small">Analog (0–5V / 4–20mA)</text>

  <rect x="820" y="220" width="220" height="70" class="box"></rect>
  <text x="850" y="262" class="txt">Valve Zone 1</text>
  <text x="850" y="282" class="small">24V DC</text>

  <rect x="820" y="305" width="220" height="70" class="box"></rect>
  <text x="850" y="347" class="txt">Valve Zone 2</text>
  <text x="850" y="367" class="small">24V DC</text>

  <rect x="820" y="390" width="220" height="70" class="box"></rect>
  <text x="850" y="432" class="txt">Valve Zone 3</text>
  <text x="850" y="452" class="small">24V DC</text>

  <!-- Lines -->
  <path d="M410 175 L500 130" class="line"></path>
  <polygon points="500,130 488,128 494,140" class="arrow"></polygon>

  <path d="M760 130 L820 130" class="line"></path>
  <polygon points="820,130 810,124 810,136" class="arrow"></polygon>

  <path d="M410 200 L500 250" class="line"></path>
  <polygon points="500,250 488,245 494,262" class="arrow"></polygon>

  <path d="M410 215 L500 370" class="line"></path>
  <polygon points="500,370 490,365 495,382" class="arrow"></polygon>

  <path d="M410 230 L820 255" class="line"></path>
  <polygon points="820,255 808,249 810,261" class="arrow"></polygon>

  <path d="M410 235 L820 340" class="line"></path>
  <polygon points="820,340 810,336 813,350" class="arrow"></polygon>

  <path d="M410 240 L820 425" class="line"></path>
  <polygon points="820,425 812,420 814,435" class="arrow"></polygon>

  <text x="90" y="520" class="note">Tip: label each terminal and valve wire for training &amp; troubleshooting.</text>
</svg>