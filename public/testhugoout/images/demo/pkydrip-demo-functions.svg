<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
  <defs>
    <style>
      .title { font: 700 20px Arial, sans-serif; fill: #111; }
      .txt { font: 16px Arial, sans-serif; fill: #111; }
      .small { font: 14px Arial, sans-serif; fill: #111; }
      .box { fill: #fff; stroke: #111; stroke-width: 2; rx: 14; }
      .line { stroke: #111; stroke-width: 2.2; fill: none; }
      .arrow { fill: #111; }
    </style>
  </defs>

  <text x="40" y="48" class="title">Demonstration Functions Map</text>
  <text x="40" y="76" class="small">A platform-level view for contractors and partners</text>

  <rect x="420" y="120" width="300" height="80" class="box"></rect>
  <text x="455" y="165" class="txt">PKYDRIP Controller</text>
  <text x="455" y="188" class="small">Automation + Monitoring + Protection</text>

  <rect x="90" y="80" width="280" height="80" class="box"></rect>
  <text x="120" y="125" class="txt">Scheduling &amp; Plans</text>
  <text x="120" y="148" class="small">Daily / Weekly / Multi cycles</text>

  <rect x="90" y="190" width="280" height="80" class="box"></rect>
  <text x="120" y="235" class="txt">Sequential Valves</text>
  <text x="120" y="258" class="small">One zone at a time</text>

  <rect x="90" y="300" width="280" height="80" class="box"></rect>
  <text x="120" y="345" class="txt">Pump Control</text>
  <text x="120" y="368" class="small">Start/Stop + interlock</text>

  <rect x="760" y="80" width="300" height="80" class="box"></rect>
  <text x="790" y="125" class="txt">Monitoring Data</text>
  <text x="790" y="148" class="small">Flow / Pressure / Status</text>

  <rect x="760" y="190" width="300" height="80" class="box"></rect>
  <text x="790" y="235" class="txt">Protection &amp; Alarms</text>
  <text x="790" y="258" class="small">Over-pressure / Low-flow</text>

  <rect x="760" y="300" width="300" height="80" class="box"></rect>
  <text x="790" y="345" class="txt">Training &amp; Replication</text>
  <text x="790" y="368" class="small">Installer onboarding kit</text>

  <!-- Lines -->
  <path d="M370 120 L420 150" class="line"></path>
  <polygon points="420,150 409,145 413,157" class="arrow"></polygon>

  <path d="M370 230 L420 160" class="line"></path>
  <polygon points="420,160 409,158 416,170" class="arrow"></polygon>

  <path d="M370 340 L420 170" class="line"></path>
  <polygon points="420,170 409,170 418,180" class="arrow"></polygon>

  <path d="M720 150 L760 120" class="line"></path>
  <polygon points="760,120 748,118 754,130" class="arrow"></polygon>

  <path d="M720 160 L760 230" class="line"></path>
  <polygon points="760,230 748,224 752,241" class="arrow"></polygon>

  <path d="M720 170 L760 340" class="line"></path>
  <polygon points="760,340 750,335 755,352" class="arrow"></polygon>
</svg>