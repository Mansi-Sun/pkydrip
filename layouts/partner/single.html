{{ define "main" }}

<section class="section">
  <div class="container" style="max-width: 960px; margin: 0 auto; padding: 40px 20px;">

    <article>
      <header style="margin-bottom: 30px;">
        <h1 style="margin-bottom: 12px;">{{ .Title }}</h1>

        {{ with .Params.description }}
        <p style="color: #666; font-size: 1.05rem; line-height: 1.8;">
          {{ . }}
        </p>
        {{ end }}
      </header>

      {{ with .Params.image }}
      <div style="margin-bottom: 30px;">
        <img src="{{ . | relURL }}" alt="{{ $.Title }}" style="width: 100%; height: auto; border-radius: 10px;">
      </div>
      {{ end }}

      <div class="content">
        {{ .Content }}
      </div>

      <div style="margin-top: 40px; padding-top: 20px; border-top: 1px solid #e5e5e5;">
        <a href="/partner/" style="text-decoration: none; font-weight: 600;">
          ← Back to Partner
        </a>
      </div>
    </article>

  </div>
</section>

{{ end }}
