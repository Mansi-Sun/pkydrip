{{ define "main" }}
<section class="page-title-area">
  <div class="container">
    <h1>{{ .Title }}</h1>
    {{ with .Params.description }}<p>{{ . }}</p>{{ end }}
  </div>
</section>

<section class="page-content" style="padding:40px 0;">
  <div class="container">
    <article class="content">
      {{ .Content }}
    </article>
  </div>
</section>
{{ end }}
