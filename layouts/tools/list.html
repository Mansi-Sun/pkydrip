{{ define "main" }}

<section class="section">
  <div class="container">

    <div class="row justify-content-center">
      <div class="col-lg-10">

        <!-- Page Title -->
        <h1 class="mb-4">{{ .Title }}</h1>

        <!-- Page Description -->
        {{ with .Params.description }}
        <p class="mb-4 text-muted">{{ . }}</p>
        {{ end }}

        <!-- Markdown Content -->
        <div class="content">
          {{ .Content }}
        </div>

      </div>
    </div>

  </div>
</section>

{{ end }}
