{{ define "main" }}

<section class="container" style="max-width:1000px;margin:auto;padding:40px 20px;">

  <!-- Title -->
  <h1 style="margin-bottom:20px;">
    {{ .Title }}
  </h1>

  <!-- Description（如果有） -->
  {{ with .Params.description }}
  <p style="color:#666;margin-bottom:30px;font-size:16px;">
    {{ . }}
  </p>
  {{ end }}

  <!-- Main Content -->
  <div style="line-height:1.8;font-size:16px;">
    {{ .Content }}
  </div>

</section>

{{ end }}
