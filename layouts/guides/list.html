{{ define "main" }}

<section class="page-title-area" style="padding:60px 0;border-bottom:1px solid #eee;">
  <div class="container">
    <h1>{{ .Title }}</h1>
    {{ with .Params.description }}
      <p style="max-width:820px;color:#666;">{{ . }}</p>
    {{ end }}
  </div>
</section>

<section class="guide-content" style="padding:50px 0;">
  <div class="container" style="max-width:920px;">

    <article class="content">
      {{ .Content }}
    </article>

    <hr style="margin:60px 0;">

    <div class="guide-cta" style="background:#f8f9fb;padding:30px;border-radius:8px;">
      <h3>Discuss your irrigation project</h3>
      <p style="margin-bottom:20px;color:#555;">
        Share your project size, number of valves, water source, and power supply.
        Our engineers will recommend a suitable control solution.
      </p>

      <a href="https://wa.me/XXXXXXXXXX"
         style="display:inline-block;background:#25D366;color:#fff;
                padding:12px 24px;border-radius:4px;text-decoration:none;">
        Chat on WhatsApp
      </a>
    </div>

  </div>
</section>

{{ end }}
