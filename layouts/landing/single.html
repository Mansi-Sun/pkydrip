{{ define "main" }}

{{ with .Params.bg_image }}
<section style="
  position: relative;
  min-height: 260px;
  background: linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.15)), url({{ . }}) center center / cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
">
  <div style="
    max-width: 900px;
    margin: 0 auto;
    padding: 60px 20px;
    text-align: center;
    color: #fff;
  ">
    <h1 style="margin:0;font-size:36px;line-height:1.2;color:#fff;">
      {{ $.Title }}
    </h1>
  </div>
</section>
{{ end }}

<section style="padding:40px 15px;">
  <div style="max-width:760px;margin:auto;">
    <div class="content">
      {{ .Content }}
    </div>
  </div>
</section>

{{ end }}
