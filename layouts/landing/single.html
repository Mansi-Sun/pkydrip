{{ define "main" }}

{{ with .Params.bg_image }}
<section style="
  position: relative;
  min-height: 220px;
  background: linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)), url('{{ . }}') center center / cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
">
  <div style="
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 20px;
    text-align: center;
    color: #fff;
  ">
    <h1 style="margin:0;font-size:32px;line-height:1.2;color:#fff;">{{ $.Title }}</h1>
  </div>
</section>
{{ end }}

<section style="padding:30px 15px;">
  <div style="max-width:760px;margin:auto;">

    {{ with .Params.description }}
    <p style="
  font-size:20px;
  font-weight:500;
  color:#333;
  margin-bottom:12px;
  max-width:640px;
  line-height:1.5;
">
  Not sure how to start your irrigation project?
</p>

<p style="
  font-size:16px;
  color:#666;
  margin-bottom:30px;
  max-width:640px;
  line-height:1.6;
">
  Start with a simple discussion and define the right system or upgrade path.
</p>
 
  {{ . }}
</p>
        
      {{ . }}
    </p>
    {{ end }}

    <div class="content">
      {{ .Content }}
    </div>

  </div>
</section>

{{ end }}
