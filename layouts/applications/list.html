{{ define "main" }}

<section class="container" style="max-width:1100px;margin:auto;padding:40px 20px;">

  <h1 style="margin-bottom:10px;">{{ .Title }}</h1>

  {{ if .Content }}
  <div style="margin-bottom:40px;color:#666;line-height:1.8;">
    {{ .Content }}
  </div>
  {{ end }}

  {{ if .RegularPages }}
  <div>
    {{ range .RegularPages }}
    <div style="margin-bottom:40px;padding-bottom:20px;border-bottom:1px solid #eee;">

      <h2 style="margin-bottom:10px;">
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      </h2>

      {{ if .Summary }}
      <p style="color:#666;">
        {{ .Summary }}
      </p>
      {{ end }}

      <a href="{{ .RelPermalink }}">Read More →</a>

    </div>
    {{ end }}
  </div>
  {{ end }}

</section>

{{ end }}
