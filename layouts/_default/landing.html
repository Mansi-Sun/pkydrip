{{ define "main" }}

<!-- Hero Section -->
{{ with .Params.bg_image }}
<section style="
  position:relative;
  background-image:url('{{ . }}');
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  min-height:280px;
  display:flex;
  align-items:center;
  justify-content:center;
">
  <!-- Overlay -->
  <div style="
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.4);
  "></div>

  <!-- Hero Content -->
  <div style="
    position:relative;
    z-index:2;
    max-width:900px;
    margin:auto;
    padding:40px 20px;
    text-align:center;
    color:#fff;
  ">
    <h1 style="margin:0;font-size:32px;line-height:1.2;color:#fff;">{{ $.Title }}</h1>
  </div>
</section>
{{ end }}

<!-- Main Content -->
<section style="padding:30px 15px;">
  <div style="max-width:760px;margin:auto;">

    {{ with .Params.description }}
    <p style="font-size:16px;color:#666;text-align:center;margin-bottom:20px;">
      {{ . }}
    </p>
    {{ end }}

    <div class="content">
      {{ .Content }}
    </div>

  </div>
</section>

{{ end }}
