{{ define "main" }}

<!-- Hero Section -->
{{ with .Params.bg_image }}
<section style="position:relative;">
  
  <div style="
    background-image:url('{{ . }}');
    background-size:cover;
    background-position:center;
    height:280px;
    display:flex;
    align-items:center;
    justify-content:center;
  ">
    
    <!-- 黑色遮罩（提高可读性） -->
    <div style="
      position:absolute;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.4);
    "></div>

    <!-- 标题 -->
    <div style="position:relative;z-index:2;text-align:center;color:#fff;padding:0 20px;">
      <h1 style="margin:0;font-size:28px;">{{ $.Title }}</h1>
    </div>

  </div>

</section>
{{ end }}

<!-- Main Content -->
<section style="padding:30px 15px;">
  <div style="max-width:760px;margin:auto;">

    {{ with .Params.description }}
    <p style="font-size:16px;color:#666;text-align:center;margin-bottom:20px;">
      {{ . }}
    </p>
    {{ end }}

    <div class="content">
      {{ .Content }}
    </div>

  </div>
</section>

{{ end }}
