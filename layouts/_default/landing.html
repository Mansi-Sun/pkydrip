{{ define "main" }}

<section class="section">
  <div class="container">

    <div style="max-width:800px;margin:auto;text-align:center;">

      <h1 style="margin-bottom:20px;">{{ .Title }}</h1>

      {{ with .Params.description }}
      <p style="font-size:18px;color:#666;margin-bottom:30px;">
        {{ . }}
      </p>
      {{ end }}

      <!-- 内容 -->
      <div class="content">
        {{ .Content }}
      </div>

    </div>

  </div>
</section>

{{ end }}
