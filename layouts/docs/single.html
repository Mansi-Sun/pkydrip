{{ define "main" }}

<section style="max-width:1100px;margin:auto;padding:40px 20px;">

  <h1 style="font-size:34px;margin-bottom:10px;">
    {{ .Title }}
  </h1>

  {{ with .Params.description }}
  <p style="font-size:16px;color:#555;margin-bottom:30px;line-height:1.7;">
    {{ . }}
  </p>
  {{ end }}

  <div class="content" style="font-size:16px;line-height:1.8;color:#333;">
    {{ .Content }}
  </div>

</section>

{{ end }}
